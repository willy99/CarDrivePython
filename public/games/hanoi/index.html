<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tower of Hanoi</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050010; overflow:hidden; font-family:'Segoe UI',system-ui,sans-serif; color:#fff; user-select:none; }
canvas { position:fixed; inset:0; }
#game-canvas { cursor:default; z-index:1; }
#game-canvas.grabbing { cursor:grabbing; }
#app { position:fixed; inset:0; z-index:2; pointer-events:none; display:flex; flex-direction:column; }

#hud {
  pointer-events:all; flex-shrink:0; height:60px;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
  background:rgba(0,0,0,0.55); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.07);
}
.hud-block { display:flex; flex-direction:column; align-items:center; gap:1px; min-width:60px; }
.hud-lbl { font-size:9px; letter-spacing:2px; text-transform:uppercase; color:rgba(255,255,255,0.35); }
.hud-val { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.1; }
.hud-sub { font-size:10px; font-weight:700; margin-top:1px; min-height:13px; }
.hud-title { font-size:13px; font-weight:900; letter-spacing:4px; text-transform:uppercase;
  background:linear-gradient(90deg,#c084fc,#60a5fa,#34d399);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
#hud-diff { font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; }
#hud-timer { color:#7dd3fc; }
#hud-timer.elapsed { color:#a3e635; }
#hud-timer.warn   { color:#fbbf24; animation:blink 1s infinite; }
#hud-timer.danger { color:#f87171; animation:blink .45s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.25} }
#hud-moves { color:#34d399; }
#hud-level { color:#a78bfa; }
#hud-best  { color:#fbbf24; }

#footer {
  pointer-events:all; margin-top:auto; flex-shrink:0; height:52px;
  display:flex; align-items:center; justify-content:center; gap:10px;
  background:rgba(0,0,0,0.55); backdrop-filter:blur(12px);
  border-top:1px solid rgba(255,255,255,0.07);
}
.btn {
  padding:8px 16px; border-radius:9px;
  border:1px solid rgba(255,255,255,0.18);
  background:rgba(255,255,255,0.07); color:#fff;
  font-size:13px; font-weight:600; cursor:pointer; transition:all .18s;
}
.btn:hover:not(:disabled) { background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.35); transform:translateY(-1px); }
.btn:disabled { opacity:.3; cursor:not-allowed; }
.btn-primary {
  background:linear-gradient(135deg,#5b21b6,#4338ca);
  border-color:rgba(167,139,250,.35);
  box-shadow:0 0 18px rgba(91,33,182,.45);
}
.btn-primary:hover:not(:disabled) { background:linear-gradient(135deg,#6d28d9,#4f46e5); box-shadow:0 0 28px rgba(91,33,182,.7); }

#overlay {
  position:fixed; inset:0; z-index:10;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.7); backdrop-filter:blur(10px);
  opacity:0; pointer-events:none; transition:opacity .35s;
}
#overlay.show { opacity:1; pointer-events:all; }
#ov-box {
  background:linear-gradient(145deg,rgba(25,10,55,.97),rgba(8,4,24,.97));
  border:1px solid rgba(255,255,255,.12); border-radius:22px;
  padding:36px 44px; text-align:center; max-width:400px; width:90%;
  box-shadow:0 24px 60px rgba(0,0,0,.9),0 0 80px rgba(120,60,255,.25);
  transform:scale(.82) translateY(20px); transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
#overlay.show #ov-box { transform:scale(1) translateY(0); }
.ov-emoji { font-size:54px; display:block; margin-bottom:12px; }
.ov-title { font-size:27px; font-weight:800; margin-bottom:6px; }
.ov-sub   { font-size:14px; color:rgba(255,255,255,.55); margin-bottom:20px; }
.ov-stats { display:flex; justify-content:center; gap:18px; margin-bottom:22px; flex-wrap:wrap;
  padding:14px 0; border-top:1px solid rgba(255,255,255,.07); border-bottom:1px solid rgba(255,255,255,.07); }
.stat { display:flex; flex-direction:column; align-items:center; gap:3px; }
.stat-v { font-size:21px; font-weight:700; }
.stat-l { font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:rgba(255,255,255,.35); }
.ov-btns { display:flex; gap:10px; justify-content:center; }
.name-row {
  display:flex; align-items:center; gap:8px; justify-content:center;
  margin-top:16px; padding-top:14px; border-top:1px solid rgba(255,255,255,.07);
}
.name-row input {
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.2);
  color:#fff; border-radius:8px; padding:7px 12px; font-size:13px; width:140px;
  outline:none; transition:border-color .18s;
}
.name-row input:focus { border-color:rgba(167,139,250,.7); }
.name-row input::placeholder { color:rgba(255,255,255,.3); }
.percentile-badge {
  display:inline-block; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:700;
  background:linear-gradient(135deg,#1d4ed8,#7c3aed); border:1px solid rgba(167,139,250,.4);
  margin-top:6px;
}
.confetti { position:fixed; pointer-events:none; z-index:200; animation:cfall linear forwards; }
@keyframes cfall { 0%{transform:translateY(0) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(720deg);opacity:0} }

#hof-overlay {
  position:fixed; inset:0; z-index:20;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.75); backdrop-filter:blur(12px);
  opacity:0; pointer-events:none; transition:opacity .3s;
}
#hof-overlay.show { opacity:1; pointer-events:all; }
#hof-box {
  background:linear-gradient(145deg,rgba(20,8,50,.98),rgba(6,3,18,.98));
  border:1px solid rgba(255,255,255,.1); border-radius:22px;
  width:min(780px,95vw); max-height:85vh; overflow:hidden;
  display:flex; flex-direction:column;
  box-shadow:0 30px 80px rgba(0,0,0,.9),0 0 100px rgba(100,50,255,.2);
}
#hof-header { padding:22px 28px 16px; border-bottom:1px solid rgba(255,255,255,.07);
  display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
#hof-header h2 { font-size:20px; font-weight:800; letter-spacing:1px; }
#hof-close { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  color:#fff; border-radius:8px; padding:6px 14px; cursor:pointer; font-size:13px; transition:all .18s; }
#hof-close:hover { background:rgba(255,255,255,.15); }
#hof-filters { padding:12px 28px; display:flex; gap:6px; flex-wrap:wrap; flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,.06); }
.hof-tab { padding:5px 12px; border-radius:20px; font-size:12px; font-weight:600;
  cursor:pointer; border:1px solid rgba(255,255,255,.15); color:rgba(255,255,255,.6);
  background:transparent; transition:all .15s; }
.hof-tab.active,.hof-tab:hover { border-color:rgba(167,139,250,.6); color:#fff; background:rgba(167,139,250,.15); }
#hof-table-wrap { overflow-y:auto; padding:0 28px 20px; flex:1; }
#hof-table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
#hof-table th { text-align:left; padding:8px 10px; font-size:10px; letter-spacing:1.5px;
  text-transform:uppercase; color:rgba(255,255,255,.35);
  border-bottom:1px solid rgba(255,255,255,.07); position:sticky; top:0;
  background:rgba(10,4,25,.98); }
#hof-table td { padding:9px 10px; border-bottom:1px solid rgba(255,255,255,.04); vertical-align:middle; }
.hof-rank { font-weight:700; font-size:15px; }
.hof-gold   { color:#fbbf24; }
.hof-silver { color:#94a3b8; }
.hof-bronze { color:#b87333; }
.hof-row-me td { background:rgba(167,139,250,.07); }
.hof-badge { display:inline-block; padding:2px 7px; border-radius:10px; font-size:11px; font-weight:700; letter-spacing:.5px; }
.hof-eff-bar { height:4px; border-radius:2px; background:rgba(255,255,255,.1); margin-top:4px; width:80px; }
.hof-eff-fill { height:100%; border-radius:2px; background:linear-gradient(90deg,#6d28d9,#2563eb); }
#hof-empty { padding:40px; text-align:center; color:rgba(255,255,255,.35); font-size:14px; }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<canvas id="game-canvas"></canvas>

<div id="app">
  <div id="hud">
    <div class="hud-block">
      <span class="hud-lbl">Level</span>
      <span class="hud-val" id="hud-level">1</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
      <span class="hud-title">Tower of Hanoi</span>
      <span id="hud-diff">Tutorial</span>
    </div>
    <div class="hud-block">
      <span class="hud-lbl" id="hud-timer-lbl">Time</span>
      <span class="hud-val" id="hud-timer">0:00</span>
    </div>
    <div class="hud-block">
      <span class="hud-lbl">Moves</span>
      <span class="hud-val" id="hud-moves">0</span>
      <span class="hud-sub" id="hud-extra"></span>
    </div>
    <div class="hud-block">
      <span class="hud-lbl">Min</span>
      <span class="hud-val" id="hud-best">7</span>
    </div>
  </div>

  <div id="footer">
    <a class="btn" href="/" target="_top">← Home</a>
    <button class="btn" id="btn-undo" onclick="undoMove()" disabled>↩ Undo</button>
    <button class="btn" onclick="restartLevel()">↺ Restart</button>
    <button class="btn btn-primary" id="btn-next" onclick="nextLevel()" disabled>Next →</button>
    <button class="btn" onclick="openHof()">🏆 HoF</button>
  </div>
</div>

<div id="overlay">
  <div id="ov-box">
    <span class="ov-emoji" id="ov-emoji">🏆</span>
    <div class="ov-title" id="ov-title"></div>
    <div class="ov-sub"   id="ov-sub"></div>
    <div id="ov-percentile"></div>
    <div class="ov-stats" id="ov-stats"></div>
    <div class="name-row" id="ov-name-row">
      <input id="ov-name-input" type="text" maxlength="20" placeholder="Your name…">
      <button class="btn btn-primary" onclick="submitScore()">Save Score</button>
    </div>
    <div class="ov-btns" id="ov-btns"></div>
  </div>
</div>

<div id="hof-overlay">
  <div id="hof-box">
    <div id="hof-header">
      <h2>🏆 Hall of Fame</h2>
      <button id="hof-close" onclick="closeHof()">✕ Close</button>
    </div>
    <div id="hof-filters"></div>
    <div id="hof-table-wrap">
      <div id="hof-empty" style="display:none">No records yet — complete a level to enter!</div>
      <table id="hof-table" style="display:none">
        <thead><tr><th>#</th><th>Player</th><th>Level</th><th>Efficiency</th><th>Moves</th><th>Optimal</th><th>Time</th><th>Date</th></tr></thead>
        <tbody id="hof-body"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  STARS BACKGROUND
// ═══════════════════════════════════════════════════════════
const bgCanvas = document.getElementById('bg-canvas');
const bgCtx    = bgCanvas.getContext('2d');

function drawStars() {
  const W = bgCanvas.width  = window.innerWidth;
  const H = bgCanvas.height = window.innerHeight;
  const g = bgCtx.createRadialGradient(W/2,H*.4,0,W/2,H/2,Math.max(W,H)*.9);
  g.addColorStop(0,'#180430'); g.addColorStop(.5,'#0b0018'); g.addColorStop(1,'#030008');
  bgCtx.fillStyle=g; bgCtx.fillRect(0,0,W,H);
  [[W*.15,H*.25,W*.35,'rgba(120,40,200,.06)'],[W*.75,H*.65,W*.3,'rgba(30,70,220,.05)'],
   [W*.5,H*.1,W*.22,'rgba(200,30,100,.04)'],[W*.85,H*.2,W*.18,'rgba(60,160,200,.04)']].forEach(([x,y,r,c])=>{
    const ng=bgCtx.createRadialGradient(x,y,0,x,y,r);
    ng.addColorStop(0,c); ng.addColorStop(1,'transparent');
    bgCtx.fillStyle=ng; bgCtx.fillRect(0,0,W,H);
  });
  let s=1234567;
  const rng=()=>{s=(s*1664525+1013904223)&0xffffffff; return(s>>>0)/0xffffffff;};
  for(let i=0;i<280;i++){
    bgCtx.beginPath();
    bgCtx.arc(rng()*W,rng()*H,rng()*1.5+.2,0,Math.PI*2);
    bgCtx.fillStyle=`hsla(${200+rng()*60},60%,95%,${rng()*.65+.25})`;
    bgCtx.fill();
  }
}
drawStars();

// ═══════════════════════════════════════════════════════════
//  GAME CANVAS
// ═══════════════════════════════════════════════════════════
const gc  = document.getElementById('game-canvas');
const ctx = gc.getContext('2d');

// ═══════════════════════════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════════════════════════
const LEVELS = [
  {num:1,disks:3,timeLimit:0,  name:'Tutorial', color:'#34d399'},
  {num:2,disks:3,timeLimit:55, name:'Easy',     color:'#38bdf8'},
  {num:3,disks:4,timeLimit:100,name:'Medium',   color:'#818cf8'},
  {num:4,disks:4,timeLimit:65, name:'Tricky',   color:'#fbbf24'},
  {num:5,disks:5,timeLimit:160,name:'Hard',     color:'#fb923c'},
  {num:6,disks:5,timeLimit:105,name:'Expert',   color:'#f87171'},
  {num:7,disks:6,timeLimit:260,name:'Master',   color:'#e879f9'},
  {num:8,disks:7,timeLimit:400,name:'Legend',   color:'#facc15'},
];

// size 1 = smallest (top of stack), size N = largest (bottom)
const DISK_PAL = [
  {a:'#ff8585',b:'#d63030',c:'#8a1a1a'},
  {a:'#ffb54a',b:'#d97010',c:'#8a4400'},
  {a:'#ffe84a',b:'#c8a000',c:'#7a6000'},
  {a:'#3de880',b:'#12b054',c:'#086035'},
  {a:'#52b8ff',b:'#1470d8',c:'#073880'},
  {a:'#c8a8ff',b:'#8830e8',c:'#4a1090'},
  {a:'#f97ec0',b:'#d01870',c:'#820840'},
];

// ═══════════════════════════════════════════════════════════
//  LAYOUT  (flat 2D)
// ═══════════════════════════════════════════════════════════
const HUD_H = 60, FOOT_H = 52;

function getLayout() {
  const W = window.innerWidth;
  const H = window.innerHeight - HUD_H - FOOT_H;
  const aT = HUD_H; // area top Y

  const pegXs = [W * 0.25, W * 0.5, W * 0.75];
  const baseY  = aT + H * 0.82;
  const pegTop = aT + H * 0.07;
  const pegW   = Math.max(10, Math.min(18, W * 0.014));

  const maxDW = Math.min(W * 0.30, 280);
  const minDW = Math.max(W * 0.07, 50);
  const dH    = Math.max(22, Math.min(34, H * 0.065));
  const dGap  = 4;
  const dR    = 8;

  const baseW = W * 0.80;
  const baseH = 16;
  const baseX = (W - baseW) / 2;

  return { W, H, aT, pegXs, baseY, pegTop, pegW, maxDW, minDW, dH, dGap, dR, baseW, baseH, baseX };
}

function diskW(size, total, L) {
  if (total <= 1) return L.maxDW;
  return L.minDW + (size - 1) * (L.maxDW - L.minDW) / (total - 1);
}

// Y of top edge of disk at stack index i (0 = bottom)
function diskTopY(i, L) {
  return L.baseY - (i + 1) * L.dH - i * L.dGap;
}

// ═══════════════════════════════════════════════════════════
//  DRAW HELPERS
// ═══════════════════════════════════════════════════════════
function rrect(cx, y, w, h, r) {
  const x = cx - w / 2;
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

// ═══════════════════════════════════════════════════════════
//  DRAW BASE
// ═══════════════════════════════════════════════════════════
function drawBase(L) {
  const { baseX: bx, baseY: by, baseW: bw, baseH: bh } = L;
  const r = 7;

  ctx.beginPath();
  ctx.moveTo(bx + r, by);
  ctx.lineTo(bx + bw - r, by);
  ctx.arcTo(bx + bw, by,      bx + bw, by + r,      r);
  ctx.lineTo(bx + bw, by + bh - r);
  ctx.arcTo(bx + bw, by + bh, bx + bw - r, by + bh, r);
  ctx.lineTo(bx + r,  by + bh);
  ctx.arcTo(bx,       by + bh, bx, by + bh - r,      r);
  ctx.lineTo(bx,      by + r);
  ctx.arcTo(bx,       by,      bx + r, by,            r);
  ctx.closePath();

  const gv = ctx.createLinearGradient(0, by, 0, by + bh);
  gv.addColorStop(0, '#c08040'); gv.addColorStop(.35,'#8a5520'); gv.addColorStop(1,'#3a2005');
  ctx.fillStyle = gv; ctx.fill();

  // top shine
  ctx.fillStyle = 'rgba(255,210,100,0.13)';
  ctx.fillRect(bx + r, by, bw - r * 2, 3);

  // glow below
  const gy = by + bh + 6;
  const gl = ctx.createRadialGradient(bx + bw/2, gy, 0, bx + bw/2, gy, bw * 0.5);
  gl.addColorStop(0, 'rgba(180,110,40,0.18)'); gl.addColorStop(1, 'transparent');
  ctx.fillStyle = gl; ctx.fillRect(0, 0, gc.width, gc.height);
}

// ═══════════════════════════════════════════════════════════
//  DRAW PEG
// ═══════════════════════════════════════════════════════════
function drawPeg(pegIdx, L, hl) {
  const cx  = L.pegXs[pegIdx];
  const x   = cx - L.pegW / 2;
  const w   = L.pegW;
  const r   = w / 2;
  const top = L.pegTop;
  const bot = L.baseY;

  ctx.beginPath();
  ctx.moveTo(x + r, top);
  ctx.arcTo(x + w, top, x + w, top + r, r);
  ctx.lineTo(x + w, bot);
  ctx.lineTo(x,     bot);
  ctx.lineTo(x,     top + r);
  ctx.arcTo(x, top, x + r, top, r);
  ctx.closePath();

  const gh = ctx.createLinearGradient(x, 0, x + w, 0);
  if (hl) {
    gh.addColorStop(0,   'rgba(180,140,30,0.7)');
    gh.addColorStop(0.4, 'rgba(255,220,70,0.95)');
    gh.addColorStop(1,   'rgba(180,140,30,0.7)');
    ctx.fillStyle = gh; ctx.fill();
    ctx.save();
    ctx.shadowColor = 'rgba(255,210,60,0.7)'; ctx.shadowBlur = 20;
    ctx.fill(); ctx.restore();
  } else {
    gh.addColorStop(0,   'rgba(80,65,130,0.5)');
    gh.addColorStop(0.4, 'rgba(165,148,240,0.8)');
    gh.addColorStop(1,   'rgba(80,65,130,0.5)');
    ctx.fillStyle = gh; ctx.fill();
  }

  // glowing dot at tip
  const tipR = L.pegW * 0.7;
  ctx.beginPath(); ctx.arc(cx, top, tipR, 0, Math.PI*2);
  ctx.fillStyle = hl ? 'rgba(255,230,80,0.9)' : 'rgba(200,185,255,0.7)';
  ctx.fill();
}

// ═══════════════════════════════════════════════════════════
//  DRAW ONE DISK
// ═══════════════════════════════════════════════════════════
function drawDisk(cx, topY, size, total, L, opts) {
  const w  = diskW(size, total, L);
  const h  = L.dH;
  const r  = L.dR;
  const p  = DISK_PAL[size - 1];
  const { selected = false, ghost = false, alpha = 1 } = opts || {};

  ctx.globalAlpha = alpha;

  if (!ghost) {
    // drop shadow
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.6)';
    ctx.shadowBlur  = 12;
    ctx.shadowOffsetY = 5;
    rrect(cx, topY, w, h, r);
    const bg = ctx.createLinearGradient(0, topY, 0, topY + h);
    bg.addColorStop(0, p.a); bg.addColorStop(.55, p.b); bg.addColorStop(1, p.c);
    ctx.fillStyle = bg; ctx.fill();
    ctx.restore();
  } else {
    rrect(cx, topY, w, h, r);
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2; ctx.setLineDash([6,4]);
    ctx.fill(); ctx.stroke(); ctx.setLineDash([]);
    ctx.globalAlpha = 1; return;
  }

  // body gradient (redrawn without shadow)
  rrect(cx, topY, w, h, r);
  const bg = ctx.createLinearGradient(0, topY, 0, topY + h);
  bg.addColorStop(0, p.a); bg.addColorStop(.55, p.b); bg.addColorStop(1, p.c);
  ctx.fillStyle = bg; ctx.fill();

  // top highlight
  rrect(cx, topY, w, h * 0.4, r);
  const hi = ctx.createLinearGradient(0, topY, 0, topY + h * 0.4);
  hi.addColorStop(0, 'rgba(255,255,255,0.30)'); hi.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = hi; ctx.fill();

  // border
  rrect(cx, topY, w, h, r);
  ctx.strokeStyle = selected ? p.a : 'rgba(255,255,255,0.13)';
  ctx.lineWidth   = selected ? 2 : 1;
  ctx.stroke();

  // selection glow
  if (selected) {
    ctx.save();
    ctx.shadowColor = p.a; ctx.shadowBlur = 24;
    rrect(cx, topY, w, h, r);
    ctx.strokeStyle = p.a; ctx.lineWidth = 2;
    ctx.stroke(); ctx.restore();
  }

  ctx.globalAlpha = 1;
}

// ═══════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════
let G = {
  levelIdx: 0,
  stacks: [[],[],[]],
  selectedPeg: null,
  moves: 0,
  undos: 0,
  gameOver: false,
  timerInterval: null,
  timeElapsed: 0,
  timeRemaining: 0,
  flying: null,
  rafId: null,
};

let moveHistory = [];

function totalDisks() { return LEVELS[G.levelIdx].disks; }
function minMoves()   { return (1 << totalDisks()) - 1; }

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════
function render() {
  gc.width  = window.innerWidth;
  gc.height = window.innerHeight;
  const L  = getLayout();
  const td = totalDisks();

  ctx.clearRect(0, 0, gc.width, gc.height);
  drawBase(L);

  // Pegs
  for (let p = 0; p < 3; p++) {
    const hl = p === G.selectedPeg || (drag.active && drag.hoverPeg === p);
    drawPeg(p, L, hl);
  }

  // Stacked disks
  for (let p = 0; p < 3; p++) {
    const stack = G.stacks[p];
    for (let i = 0; i < stack.length; i++) {
      const size = stack[i];
      const isDragTop = drag.active && drag.fromPeg === p && i === stack.length - 1;
      if (isDragTop) continue; // rendered as floating
      const isSelected = G.selectedPeg === p && i === stack.length - 1;
      const ty = diskTopY(i, L) - (isSelected ? L.dH * 0.7 : 0);
      drawDisk(L.pegXs[p], ty, size, td, L, { selected: isSelected });
    }
  }

  // Drop ghost (during drag)
  if (drag.active && drag.hoverPeg !== -1) {
    const toPeg = drag.hoverPeg;
    const fromPeg = drag.fromPeg;
    if (toPeg !== fromPeg) {
      const stackLen = G.stacks[toPeg].length;
      const ghostY = diskTopY(stackLen, L);
      drawDisk(L.pegXs[toPeg], ghostY, drag.size, td, L, { ghost: true });
    }
  }

  // Flying disk
  if (G.flying) {
    const f = G.flying;
    drawDisk(f.x, f.y, f.size, td, L, { selected: true });
  }

  // Dragged disk
  if (drag.active) {
    drawDisk(drag.mouseX, drag.mouseY - L.dH / 2, drag.size, td, L, { selected: true, alpha: 0.92 });
  }
}

// ═══════════════════════════════════════════════════════════
//  FLY ANIMATION (click mode)
// ═══════════════════════════════════════════════════════════
const PHASE_MS = [160, 260, 140];
function easeIn(t)    { return t*t; }
function easeOut(t)   { return 1-(1-t)*(1-t); }
function easeInOut(t) { return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; }

function startFly(size, fromPeg, toPeg, toIdx, onDone) {
  const L = getLayout();
  const fromIdx = G.stacks[fromPeg].length; // after pop
  const fromY = diskTopY(fromIdx, L);
  const toY   = diskTopY(toIdx,   L);
  const liftY = L.pegTop - L.dH * 2;

  G.flying = {
    size,
    x: L.pegXs[fromPeg], y: fromY,
    fromX: L.pegXs[fromPeg], toX: L.pegXs[toPeg],
    fromY, toY, liftY,
    phase: 0, t: 0, tStart: performance.now(),
  };

  function tick(now) {
    const f = G.flying; if (!f) return;
    f.t = Math.min((now - f.tStart) / PHASE_MS[f.phase], 1);
    if (f.phase === 0) { f.y = f.fromY + easeIn(f.t)    * (f.liftY - f.fromY); f.x = f.fromX; }
    else if (f.phase === 1) { f.x = f.fromX + easeInOut(f.t) * (f.toX - f.fromX); f.y = f.liftY; }
    else { f.x = f.toX; f.y = f.liftY + easeOut(f.t) * (f.toY - f.liftY); }
    render();
    if (f.t >= 1) {
      f.phase++; f.tStart = now; f.t = 0;
      if (f.phase > 2) { G.flying = null; render(); onDone(); return; }
    }
    G.rafId = requestAnimationFrame(tick);
  }
  G.rafId = requestAnimationFrame(tick);
}

// ═══════════════════════════════════════════════════════════
//  DRAG STATE
// ═══════════════════════════════════════════════════════════
let drag = { active: false, pending: false, fromPeg: -1, size: 0, mouseX: 0, mouseY: 0, startX: 0, startY: 0, hoverPeg: -1 };

function nearestPeg(mx) {
  const L = getLayout();
  let best = -1, bestD = Infinity;
  L.pegXs.forEach((px, i) => { const d = Math.abs(mx - px); if (d < bestD) { bestD = d; best = i; } });
  return bestD < L.W / 4.5 ? best : -1;
}

function topDiskPeg(mx, my) {
  const L = getLayout();
  const td = totalDisks();
  for (let p = 0; p < 3; p++) {
    if (!G.stacks[p].length) continue;
    const si   = G.stacks[p].length - 1;
    const size = G.stacks[p][si];
    const w    = diskW(size, td, L);
    const ty   = diskTopY(si, L);
    const cx   = L.pegXs[p];
    // generous hit area
    const liftOffset = G.selectedPeg === p ? L.dH * 0.7 : 0;
    if (mx >= cx - w/2 - 6 && mx <= cx + w/2 + 6 && my >= ty - liftOffset - 8 && my <= ty + L.dH + 8) return p;
  }
  return -1;
}

function pegAtX(mx) {
  const L = getLayout();
  let best = -1, bestD = Infinity;
  L.pegXs.forEach((px, i) => { const d = Math.abs(mx - px); if (d < bestD) { bestD = d; best = i; } });
  return bestD < L.W / 4.5 ? best : -1;
}

gc.addEventListener('mousedown', e => {
  if (G.flying || G.gameOver) return;
  const p = topDiskPeg(e.clientX, e.clientY);
  if (p !== -1) {
    // Clicked on a top disk — start drag or selection
    drag = { active: false, pending: true, fromPeg: p, size: G.stacks[p][G.stacks[p].length-1],
             mouseX: e.clientX, mouseY: e.clientY, startX: e.clientX, startY: e.clientY, hoverPeg: -1 };
  } else if (G.selectedPeg !== null) {
    // Disk already selected — clicking anywhere triggers placement (no drag)
    drag = { active: false, pending: true, fromPeg: G.selectedPeg,
             size: G.stacks[G.selectedPeg][G.stacks[G.selectedPeg].length - 1],
             mouseX: e.clientX, mouseY: e.clientY, startX: e.clientX, startY: e.clientY, hoverPeg: -1 };
  }
});

gc.addEventListener('mousemove', e => {
  if (drag.pending) {
    const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
    if (Math.sqrt(dx*dx+dy*dy) > 9) {
      drag.active = true; drag.pending = false;
      gc.classList.add('grabbing');
      G.selectedPeg = null;
    }
  }
  if (drag.active) {
    drag.mouseX = e.clientX; drag.mouseY = e.clientY;
    drag.hoverPeg = nearestPeg(e.clientX);
    render();
  }
});

gc.addEventListener('mouseup', e => {
  if (drag.active) {
    gc.classList.remove('grabbing');
    const to = nearestPeg(e.clientX);
    if (to !== -1 && to !== drag.fromPeg) executeMove(drag.fromPeg, to);
    drag = { active: false, pending: false, fromPeg: -1, size: 0, mouseX: 0, mouseY: 0, hoverPeg: -1 };
    render();
  } else if (drag.pending) {
    drag = { active: false, pending: false, fromPeg: -1, size: 0, mouseX: 0, mouseY: 0, hoverPeg: -1 };
    handleClick(e.clientX, e.clientY);
  }
});

gc.addEventListener('mouseleave', () => {
  if (drag.active) { gc.classList.remove('grabbing'); drag = { active:false, pending:false, fromPeg:-1, size:0, mouseX:0, mouseY:0, hoverPeg:-1 }; render(); }
});

// Touch support
gc.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const p = topDiskPeg(t.clientX, t.clientY);
  if (p === -1 || G.flying || G.gameOver) return;
  drag = { active: true, pending: false, fromPeg: p, size: G.stacks[p][G.stacks[p].length-1],
           mouseX: t.clientX, mouseY: t.clientY, startX: t.clientX, startY: t.clientY, hoverPeg: p };
  G.selectedPeg = null; render();
}, { passive: false });

gc.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!drag.active) return;
  const t = e.touches[0];
  drag.mouseX = t.clientX; drag.mouseY = t.clientY;
  drag.hoverPeg = nearestPeg(t.clientX);
  render();
}, { passive: false });

gc.addEventListener('touchend', e => {
  e.preventDefault();
  if (!drag.active) return;
  const t = e.changedTouches[0];
  const to = nearestPeg(t.clientX);
  if (to !== -1 && to !== drag.fromPeg) executeMove(drag.fromPeg, to);
  drag = { active:false, pending:false, fromPeg:-1, size:0, mouseX:0, mouseY:0, hoverPeg:-1 };
  render();
}, { passive: false });

function handleClick(mx, my) {
  const peg = pegAtX(mx);
  if (peg === -1) return;
  if (G.selectedPeg === null) {
    if (!G.stacks[peg].length) return;
    G.selectedPeg = peg; render();
  } else if (G.selectedPeg === peg) {
    G.selectedPeg = null; render();
  } else {
    const from = G.selectedPeg; G.selectedPeg = null;
    executeMove(from, peg);
  }
}

// ═══════════════════════════════════════════════════════════
//  MOVE EXECUTION
// ═══════════════════════════════════════════════════════════
function executeMove(from, to) {
  if (!G.stacks[from].length) return;
  const movingSize = G.stacks[from][G.stacks[from].length - 1];
  const topTo = G.stacks[to].length ? G.stacks[to][G.stacks[to].length - 1] : Infinity;
  if (movingSize > topTo) { flashInvalid(); render(); return; }

  moveHistory.push({ from, to });
  const toIdx = G.stacks[to].length;
  G.stacks[to].push(G.stacks[from].pop());
  G.moves++;
  updateMovesHUD();
  document.getElementById('btn-undo').disabled = false;

  startFly(movingSize, from, to, toIdx, checkWin);
}

function flashInvalid() {
  gc.style.outline = '2px solid rgba(240,60,60,0.5)';
  setTimeout(() => gc.style.outline = '', 280);
}

function updateMovesHUD() {
  document.getElementById('hud-moves').textContent = G.moves;
  const mm = minMoves();
  const extra = G.moves - mm;
  const el = document.getElementById('hud-extra');
  if (G.moves === 0) { el.textContent = ''; return; }
  if (extra < 0) {
    el.textContent = `${G.moves}/${mm}`;
    el.style.color = 'rgba(255,255,255,0.35)';
  } else if (extra === 0) {
    el.textContent = '✓ perfect';
    el.style.color = '#34d399';
  } else {
    el.textContent = `+${extra} extra`;
    el.style.color = extra<=2?'#fbbf24':extra<=5?'#fb923c':'#f87171';
  }
}

// ═══════════════════════════════════════════════════════════
//  UNDO
// ═══════════════════════════════════════════════════════════
function undoMove() {
  if (!moveHistory.length || G.flying || G.gameOver) return;
  const last = moveHistory.pop();
  G.stacks[last.from].push(G.stacks[last.to].pop());
  G.undos++;
  // undo doesn't change move count — every attempted move counts
  if (!moveHistory.length) document.getElementById('btn-undo').disabled = true;
  render();
}

// ═══════════════════════════════════════════════════════════
//  LOCALSTORAGE
// ═══════════════════════════════════════════════════════════
const LS_LEVEL='hanoi_level', LS_NAME='hanoi_name', LS_SCORES='hanoi_scores';
function lsGet(k,fb){try{const v=localStorage.getItem(k);return v===null?fb:JSON.parse(v);}catch{return fb;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function getScores()     { return lsGet(LS_SCORES,[]); }
function getSavedName()  { return lsGet(LS_NAME,''); }
function getSavedLevel() { return lsGet(LS_LEVEL,0); }

function saveScoreEntry(e) {
  const list = getScores(); list.push(e);
  list.sort((a,b)=>b.eff-a.eff||b.levelNum-a.levelNum);
  lsSet(LS_SCORES, list.slice(0,300));
}
function getPercentile(levelNum, eff) {
  const same = getScores().filter(s=>s.levelNum===levelNum);
  if (!same.length) return null;
  return Math.round(((same.filter(s=>s.eff<eff).length+1)/(same.length+1))*100);
}

// ═══════════════════════════════════════════════════════════
//  WIN / LOSE
// ═══════════════════════════════════════════════════════════
let _pending = null;

function checkWin() {
  if (G.stacks[2].length !== totalDisks()) return;
  G.gameOver = true; stopTimer();
  document.getElementById('btn-next').disabled = G.levelIdx >= LEVELS.length - 1;

  const level  = LEVELS[G.levelIdx];
  const eff    = Math.round((minMoves() / G.moves) * 100);
  const perfect = G.moves === minMoves();

  let timeStr = '--';
  if (level.timeLimit === 0) {
    timeStr = `${Math.floor(G.timeElapsed/60)}:${String(G.timeElapsed%60).padStart(2,'0')}`;
  } else {
    const used = level.timeLimit - G.timeRemaining;
    timeStr = `${Math.floor(used/60)}:${String(used%60).padStart(2,'0')}`;
  }

  _pending = { levelNum:level.num, levelName:level.name, disks:level.disks,
               moves:G.moves, minMoves:minMoves(), eff, timeStr, ts:Date.now() };

  const pct = getPercentile(level.num, eff);

  setTimeout(() => {
    document.getElementById('ov-emoji').textContent = perfect ? '🏆' : '⭐';
    document.getElementById('ov-title').textContent = 'Level Complete!';
    document.getElementById('ov-sub').textContent   = perfect
      ? 'Perfect — optimal solution!'
      : `${G.moves - minMoves()} extra move${G.moves-minMoves()===1?'':'s'}`;

    const pctEl = document.getElementById('ov-percentile');
    pctEl.innerHTML = pct !== null
      ? `<div class="percentile-badge">Top ${100-pct+1}% on Level ${level.num}</div>`
      : '<div class="percentile-badge">First record on this level!</div>';

    const undoStr = G.undos > 0 ? `<div class="stat"><span class="stat-v" style="color:#fb923c">${G.undos}</span><span class="stat-l">Undos</span></div>` : '';
    document.getElementById('ov-stats').innerHTML = `
      <div class="stat"><span class="stat-v" style="color:#34d399">${G.moves}</span><span class="stat-l">Moves</span></div>
      <div class="stat"><span class="stat-v" style="color:#fbbf24">${minMoves()}</span><span class="stat-l">Optimal</span></div>
      <div class="stat"><span class="stat-v" style="color:#38bdf8">${timeStr}</span><span class="stat-l">${level.timeLimit===0?'Time':'Used'}</span></div>
      <div class="stat"><span class="stat-v" style="color:#f472b6">${eff}%</span><span class="stat-l">Efficiency</span></div>
      ${undoStr}`;

    document.getElementById('ov-name-input').value = getSavedName();
    const hasNext = G.levelIdx < LEVELS.length - 1;
    document.getElementById('ov-btns').innerHTML = `
      <button class="btn" onclick="closeOverlay();restartLevel()">↺ Retry</button>
      ${hasNext ? `<button class="btn btn-primary" onclick="closeOverlay();nextLevel()">Next →</button>`
                : `<button class="btn btn-primary" onclick="closeOverlay()">🎉 Done!</button>`}`;
    document.getElementById('overlay').classList.add('show');
    spawnConfetti();
  }, 300);
}

function submitScore() {
  if (!_pending) return;
  const name = document.getElementById('ov-name-input').value.trim() || 'Anonymous';
  lsSet(LS_NAME, name);
  saveScoreEntry({..._pending, name});
  _pending = null;
  document.getElementById('ov-name-row').innerHTML = `<span style="color:#34d399;font-size:13px">✓ Score saved!</span>`;
}

function showLose() {
  _pending = null;
  document.getElementById('ov-percentile').innerHTML = '';
  document.getElementById('ov-name-row').innerHTML = '<button class="btn btn-primary" onclick="closeOverlay();restartLevel()">↺ Try Again</button>';
  document.getElementById('ov-emoji').textContent = '⏰';
  document.getElementById('ov-title').textContent = "Time's Up!";
  document.getElementById('ov-sub').textContent   = "So close! Try again.";
  document.getElementById('ov-stats').innerHTML = `<div class="stat"><span class="stat-v" style="color:#f87171">${G.moves}</span><span class="stat-l">Moves</span></div>`;
  document.getElementById('ov-btns').innerHTML = '';
  document.getElementById('overlay').classList.add('show');
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('ov-name-row').innerHTML = `
    <input id="ov-name-input" type="text" maxlength="20" placeholder="Your name…">
    <button class="btn btn-primary" onclick="submitScore()">Save Score</button>`;
}

// ═══════════════════════════════════════════════════════════
//  HALL OF FAME
// ═══════════════════════════════════════════════════════════
let _hofFilter = 0;
function openHof()  { _hofFilter=0; renderHof(); document.getElementById('hof-overlay').classList.add('show'); }
function closeHof() { document.getElementById('hof-overlay').classList.remove('show'); }

function renderHof() {
  document.getElementById('hof-filters').innerHTML = ['All',...LEVELS.map(l=>`Lvl ${l.num}`)].map((label,i)=>
    `<button class="hof-tab ${_hofFilter===i?'active':''}" onclick="_hofFilter=${i};renderHof()">${label}</button>`).join('');
  const all  = getScores();
  const rows = _hofFilter===0 ? all : all.filter(s=>s.levelNum===_hofFilter);
  const emptyEl=document.getElementById('hof-empty'), tableEl=document.getElementById('hof-table'), bodyEl=document.getElementById('hof-body');
  if (!rows.length) { emptyEl.style.display='block'; tableEl.style.display='none'; return; }
  emptyEl.style.display='none'; tableEl.style.display='table';
  const myName=getSavedName(), medals=['🥇','🥈','🥉'], rankCls=['hof-gold','hof-silver','hof-bronze'];
  bodyEl.innerHTML = rows.map((s,i)=>{
    const rank=i+1;
    const rd=rank<=3?`<span class="${rankCls[i]}">${medals[i]}</span>`:`<span style="color:rgba(255,255,255,.4)">${rank}</span>`;
    const lc=LEVELS.find(l=>l.num===s.levelNum)?.color??'#fff';
    const date=new Date(s.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'});
    const isMe=s.name===myName&&myName;
    return `<tr class="${isMe?'hof-row-me':''}">
      <td class="hof-rank">${rd}</td>
      <td><strong>${esc(s.name)}</strong>${isMe?' <span style="font-size:10px;color:#a78bfa">(you)</span>':''}</td>
      <td><span class="hof-badge" style="background:${lc}22;color:${lc};border:1px solid ${lc}44">Lvl ${s.levelNum} · ${s.levelName??''}</span></td>
      <td><div style="font-weight:700;color:${effColor(s.eff)}">${s.eff}%</div><div class="hof-eff-bar"><div class="hof-eff-fill" style="width:${s.eff}%"></div></div></td>
      <td>${s.moves}</td><td>${s.minMoves}</td>
      <td style="color:rgba(255,255,255,.6)">${s.timeStr}</td>
      <td style="color:rgba(255,255,255,.35);font-size:12px">${date}</td></tr>`;
  }).join('');
}
function effColor(e) { return e>=95?'#34d399':e>=75?'#fbbf24':e>=50?'#fb923c':'#f87171'; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════════════════════════════
//  TIMER
// ═══════════════════════════════════════════════════════════
function startTimer() {
  stopTimer();
  const level=LEVELS[G.levelIdx];
  const tEl=document.getElementById('hud-timer'), lEl=document.getElementById('hud-timer-lbl');
  if (level.timeLimit===0) {
    lEl.textContent='Time'; tEl.className='hud-val elapsed'; tEl.textContent='0:00';
    G.timerInterval=setInterval(()=>{ if(G.gameOver)return; G.timeElapsed++;
      tEl.textContent=`${Math.floor(G.timeElapsed/60)}:${String(G.timeElapsed%60).padStart(2,'0')}`; },1000);
  } else {
    lEl.textContent='Left'; G.timeRemaining=level.timeLimit; refreshTimer();
    G.timerInterval=setInterval(()=>{ if(G.gameOver)return; G.timeRemaining--; refreshTimer();
      if(G.timeRemaining<=0){stopTimer();G.gameOver=true;setTimeout(showLose,200);} },1000);
  }
}
function refreshTimer() {
  const t=G.timeRemaining, el=document.getElementById('hud-timer');
  el.textContent=`${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;
  const r=t/LEVELS[G.levelIdx].timeLimit;
  el.className='hud-val'+(r<=.12?' danger':r<=.3?' warn':'');
}
function stopTimer() { if(G.timerInterval){clearInterval(G.timerInterval);G.timerInterval=null;} }

// ═══════════════════════════════════════════════════════════
//  LEVEL MANAGEMENT
// ═══════════════════════════════════════════════════════════
function initLevel() {
  closeOverlay(); stopTimer();
  if (G.rafId) { cancelAnimationFrame(G.rafId); G.rafId=null; }
  drag = { active:false, pending:false, fromPeg:-1, size:0, mouseX:0, mouseY:0, hoverPeg:-1 };
  moveHistory = [];

  const n=totalDisks();
  G.stacks=[Array.from({length:n},(_,i)=>n-i),[],[]];
  G.selectedPeg=null; G.moves=0; G.undos=0; G.gameOver=false; G.flying=null;
  G.timeElapsed=0; G.timeRemaining=0;

  const level=LEVELS[G.levelIdx];
  document.getElementById('hud-level').textContent=level.num;
  document.getElementById('hud-diff').textContent=level.name;
  document.getElementById('hud-diff').style.color=level.color;
  document.getElementById('hud-moves').textContent='0';
  document.getElementById('hud-extra').textContent='';
  document.getElementById('hud-best').textContent=minMoves();
  document.getElementById('btn-next').disabled=true;
  document.getElementById('btn-undo').disabled=true;

  render();
  setTimeout(()=>startTimer(),500);
}

function restartLevel() { initLevel(); }
function nextLevel() {
  if (G.levelIdx<LEVELS.length-1) { G.levelIdx++; lsSet(LS_LEVEL,G.levelIdx); initLevel(); }
}

// ═══════════════════════════════════════════════════════════
//  CONFETTI
// ═══════════════════════════════════════════════════════════
function spawnConfetti() {
  const pal=['#ff6b6b','#ffd32a','#2ed573','#1e90ff','#a78bfa','#fd79a8','#38bdf8'];
  for(let i=0;i<80;i++) setTimeout(()=>{
    const el=document.createElement('div'); const sz=7+Math.random()*8;
    el.className='confetti';
    el.style.cssText=`left:${10+Math.random()*80}%;top:-10px;width:${sz}px;height:${sz}px;
      background:${pal[Math.floor(Math.random()*pal.length)]};
      border-radius:${Math.random()>.5?'50%':'2px'};
      animation-duration:${1.6+Math.random()*2}s;`;
    document.body.appendChild(el); setTimeout(()=>el.remove(),4000);
  },i*22);
}

// ═══════════════════════════════════════════════════════════
//  RESIZE & BOOT
// ═══════════════════════════════════════════════════════════
window.addEventListener('resize',()=>{ drawStars(); render(); });
G.levelIdx = Math.min(getSavedLevel(), LEVELS.length-1);
initLevel();
</script>
