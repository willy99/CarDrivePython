<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Бабах — Miner</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <span class="title" id="title">💥 Бабах</span>
  <button class="btn" id="btn-back">← Мапа</button>
  <div class="sep"></div>
  <div id="hud">
    <span class="stat" id="stat-mines">💣 0</span>
    <span class="stat" id="stat-flags">🚩 0</span>
    <span class="stat" id="stat-time">⏱ 00:00</span>
  </div>
  <div class="spacer"></div>
  <button class="btn icon-btn" id="btn-howto-open" title="How to Play">ℹ</button>
  <button class="btn icon-btn" id="mute-toggle">🔊</button>
  <button class="btn icon-btn" id="theme-toggle">🎨</button>
  <button class="btn icon-btn" id="btn-flag-mode" style="display:none" title="Flag mode">🚩</button>
  <button class="btn icon-btn" id="btn-restart" style="display:none" title="Retry">↺</button>
  <button class="btn" id="lang-toggle">🇬🇧 EN</button>
</div>

<!-- Pixi canvas mounts here -->
<div id="stage"></div>

<!-- Equipped artifacts (during play) -->
<div id="tools"></div>

<!-- Hint -->
<div id="hint"></div>

<!-- Transient toast (pickups, saves, promotions) -->
<div id="toast"></div>

<!-- Level select -->
<div id="select">
  <div id="rank-card"></div>
  <div id="select-toolbar"></div>
  <h2 id="select-title">Вибери операцію</h2>
  <div id="level-grid"></div>
</div>

<!-- Gear modal (backpack + stash) -->
<div id="stash-modal">
  <div id="stash-modal-box">
    <div id="stash-modal-header">
      <span id="stash-modal-title">🎒 Спорядження</span>
      <button id="btn-stash-close">✕</button>
    </div>
    <div id="stash-modal-body">
      <div id="stash-panel"></div>
    </div>
  </div>
</div>

<!-- How to Play modal -->
<div id="howto-modal">
  <div id="howto-box">
    <div id="howto-header">
      <span id="howto-title">📖 How to Play</span>
      <button id="btn-howto-close">✕</button>
    </div>
    <div id="howto-body"></div>
  </div>
</div>

<!-- Achievements & Skins modal -->
<div id="ach-modal">
  <div id="ach-box">
    <div id="ach-header">
      <span id="ach-title">🏅 Achievements & Skins</span>
      <button id="btn-ach-close">✕</button>
    </div>
    <div id="ach-body"></div>
  </div>
</div>

<!-- Result overlay -->
<div id="overlay">
  <div id="ov-icon"></div>
  <h2 id="ov-title"></h2>
  <p id="ov-text"></p>
  <div class="ov-btns">
    <button class="big-btn" id="ov-next"></button>
    <button class="big-btn alt" id="ov-again"></button>
    <button class="big-btn ghost" id="ov-map"></button>
  </div>
</div>

<script src="js/pixi.min.js"></script>
<script type="module" src="js/game.js?v=5"></script>
</body>
</html>
