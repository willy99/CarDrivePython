# Netlify deployment config
[build]
  command = "npm run build"
  publish  = "dist"

# Cross-origin isolation headers (required for pygbag WebAssembly / SharedArrayBuffer)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy   = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "cross-origin"

# SPA fallback for React Router — BUT exclude /games/* so the static game
# files (index.html, .apk, .tar.gz) are served as-is, not the React app.
[[redirects]]
  from = "/games/*"
  to   = "/games/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200
